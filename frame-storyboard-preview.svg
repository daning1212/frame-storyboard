<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">frame-storyboard 미리보기</title>
  <desc id="desc">장면 목록, 사진이 들어간 컷 보드, 컷별 연출 편집 패널을 보여주는 로컬 스토리보드 프로그램 화면 예시</desc>
  <defs>

    <linearGradient id="img2" x2="0" y2="1"><stop stop-color="#18263b"/><stop offset=".6" stop-color="#778b86"/><stop offset="1" stop-color="#1e2921"/></linearGradient>
    <linearGradient id="img3" x2="0" y2="1"><stop stop-color="#293245"/><stop offset=".58" stop-color="#a75c48"/><stop offset="1" stop-color="#1a1b20"/></linearGradient>
